[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "optical-pinhole-backend"
version = "0.1.0"
description = "Backend FastAPI de la calculadora óptica paramétrica (proyecto 1/3 del portafolio)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "black>=24.0"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ["py311"]
